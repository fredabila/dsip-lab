[project]
name = "dsip-lab"
version = "0.1.0"
description = "Config-driven toolkit for training medical image models (classification & detection) with classic DSP/DIP preprocessing."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "ultralytics>=8.3.0",
    "opencv-python>=4.8",
    "numpy>=1.24",
    "pyyaml>=6.0",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
demo = ["gradio>=4.0"]
dev = ["pytest>=8.0"]

[project.scripts]
dsip = "dsip.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["dsip*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
