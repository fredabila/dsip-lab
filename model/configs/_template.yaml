# Copy this file to configs/<your_project>.yaml and edit it.
# Paths are relative to the folder you run `dsip` from (the model/ folder).

name: my_project            # used for output folders: data/prepared/<name>, runs/<name>
task: classify              # classify (one label per image) | detect (bounding boxes, YOLO format)

data:
  # Where you downloaded/unzipped the raw dataset. Can be overridden with --source.
  source: data/raw/my_dataset

  # classify: each image's PARENT FOLDER NAME is its label.
  # class_map renames folders to class names; folders not listed are ignored
  # (handy to drop a class, or when folders are called 0/1).
  # class_map:
  #   "0": benign
  #   "1": malignant

  # detect: class names, if the dataset has no data.yaml with `names`.
  # classes: [parasite, white_blood_cell]

  # Skip files whose name or relative path matches any of these globs.
  exclude: ["*_mask*", "*.db"]

  # Patient-level split (avoid data leakage!). If several images come from the same
  # patient/slide, they must all be in the same split. group_level says which folder
  # identifies the patient, counting upwards from the label folder:
  #   0 = the label folder itself, 1 = its parent (e.g. <patient>/<label>/img.png)
  # Leave null when every image is independent.
  group_level: null

  split: {val: 0.15, test: 0.15}   # the rest is train
  balance: none                    # none | oversample | undersample (train split only)
  max_per_class: null              # e.g. 2000 for a quick experiment on a big dataset
  dedupe: true                     # drop byte-identical duplicate images
  seed: 42

# For binary problems: which class is "disease present". Enables sensitivity,
# specificity, PPV, NPV and the threshold analysis in `dsip evaluate`.
positive_class: malignant

# Classic DSP / DIP preprocessing, applied in order to every image (train AND inference).
# `dsip ops` lists all operations. `dsip preview -c <config>` shows their effect.
preprocess:
  - clahe: {clip_limit: 2.0, tile_grid: 8}
  - median_blur: {ksize: 3}
  # - fft_filter: {kind: highboost, cutoff: 0.15, boost: 0.5}
  # - homomorphic: {gamma_low: 0.6, gamma_high: 1.4, cutoff: 0.05}
  # - reinhard_normalize: {reference: data/raw/reference_slide.png}
  # - resize: {size: 224}

# Pretrained starting point (downloaded automatically).
# classify: yolo11n-cls.pt (fast) | yolo11s-cls.pt | yolo11m-cls.pt (more accurate, slower)
# detect:   yolo11n.pt | yolo11s.pt | yolo11m.pt
model: yolo11n-cls.pt

# Passed straight to Ultralytics `model.train(...)`. Full list:
# https://docs.ultralytics.com/modes/train/#train-settings
train:
  epochs: 30
  imgsz: 224
  batch: 32
  patience: 10          # early stopping
  # device: 0           # GPU 0; "cpu" to force CPU
  # lr0: 0.001
  # Augmentation (medical images usually tolerate flips; avoid strong colour jitter
  # if you rely on stain colour):
  # fliplr: 0.5
  # flipud: 0.5
  # hsv_h: 0.0
